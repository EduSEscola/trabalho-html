<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho de Compras - Edu Cubos Mágicos Oficial</title>
    <link rel="stylesheet" href="cartstyle.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <script src="cart.js"></script>
  </head>
  <body>
    <header>
      <div>
        <div style="display: flex;">
          <a href="produtos.html" style="align-items: left;"><- Voltar aos produtos</a><br>
        </div>        
        <span>Meu Carrinho de Compras</span>
      </div>      
    </header>
    <main>
      <div class="page-title">Faça o seu pedido aqui:</div>
      <div class="content">
        <section>
          <table>
            <thead>
              <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Quantidade</th>
                <th>Total</th>
                <th>-</th>
              </tr>
            </thead>
            <tbody id="cart-items"></tbody>
          </table>
        </section>
        <aside>
          <div class="box">
            <header>Resumo da compra</header>
            <div class="info">
              <div><span>Sub-total</span><span id="cart-subtotal">R$ 3.000,00</span></div>
              <div><span>Frete</span><span>Gratuito</span></div>
              <div>
                <button id="open-coupon-btn" class="coupon-btn">
                  Adicionar cupom de desconto
                  <i class="bx bx-right-arrow-alt"></i>
                </button>
              </div>
            </div>
            <footer>
              <span>Total</span>
              <span id="cart-total">R$ 0,00</span>
            </footer>
          </div>
          <button onclick="finishPayment()">Finalizar Compra</button>
        </aside>
      </div>
    </main>
    <div id="coupon-modal" class="modal-overlay">
      <div class="modal-content">
        <button id="close-modal-btn" class="close-modal">&times;</button>
        <h3>Cupom de Desconto</h3>
        <p>Digite o código promocional abaixo:</p>
        <input type="text" id="coupon-input" />
        <span id="coupon-feedback" class="feedback-msg"></span>
        <button id="confirm-coupon-btn" class="confirm-btn">Confirmar</button>
      </div>
    </div>
  </body>
</html>
